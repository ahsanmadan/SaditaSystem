image: php:8.2-cli

stages:
    - prepare
    - test
    - build
    - deploy

variables:
    MYSQL_ROOT_PASSWORD: root
    MYSQL_DATABASE: sadita_test
    MYSQL_USER: sadita
    MYSQL_PASSWORD: secret
    DB_HOST: mysql
    DB_DATABASE: sadita_test
    DB_USERNAME: sadita
    DB_PASSWORD: secret

# ─────────────────────────────────────────
# CACHE: hemat waktu, composer tidak download ulang tiap run
# ─────────────────────────────────────────
cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
        - vendor/
        - node_modules/

# ─────────────────────────────────────────
# STAGE 1: PREPARE - Install dependencies
# ─────────────────────────────────────────
install-dependencies:
    stage: prepare
    before_script:
        - apt-get update -qq && apt-get install -y git unzip libzip-dev libpng-dev libonig-dev
        - docker-php-ext-install zip pdo pdo_mysql mbstring gd
        - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    script:
        - composer install --prefer-dist --no-ansi --no-interaction --no-progress
        - cp .env.example .env
        - php artisan key:generate
    artifacts:
        paths:
            - vendor/
            - .env
        expire_in: 1 hour

# ─────────────────────────────────────────
# STAGE 2: TEST - Jalankan unit & feature test
# ─────────────────────────────────────────
run-tests:
    stage: test
    services:
        - mysql:8.0
    before_script:
        - apt-get update -qq && apt-get install -y libzip-dev libpng-dev libonig-dev
        - docker-php-ext-install zip pdo pdo_mysql mbstring gd
        - cp .env.example .env
        - sed -i "s/DB_HOST=.*/DB_HOST=mysql/" .env
        - sed -i "s/DB_DATABASE=.*/DB_DATABASE=${MYSQL_DATABASE}/" .env
        - sed -i "s/DB_USERNAME=.*/DB_USERNAME=${MYSQL_USER}/" .env
        - sed -i "s/DB_PASSWORD=.*/DB_PASSWORD=${MYSQL_PASSWORD}/" .env
        - php artisan key:generate
        - php artisan migrate --force
    script:
        - php artisan test
    only:
        - merge_requests
        - develop
        - main

# ─────────────────────────────────────────
# STAGE 3: BUILD (opsional, kalau pakai Vite/npm)
# ─────────────────────────────────────────
build-assets:
    stage: build
    image: node:20
    script:
        - npm ci
        - npm run build
    artifacts:
        paths:
            - public/build/
        expire_in: 1 hour
    only:
        - develop
        - main

